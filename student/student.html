<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Run - Student</title>
    <script src="../firebase/firebase.js"></script>
    <link rel="stylesheet" href="student.css" />
  </head>
  <body>
    <div class="header">
      <h1>🔢 Number Run</h1>
      <button class="logout-btn" onclick="window.location.href='../index.html'">
        Exit
      </button>
    </div>

    <div class="container" id="join-screen">
      <div class="card" style="max-width: 400px; margin: 0 auto;">
        <h2>🎒 Join Your Class</h2>
        <p style="opacity:0.6; margin-bottom:20px; font-size:14px;">Ask your teacher for the class code</p>
        <input type="text" id="code-input" placeholder="Enter class code..." maxlength="5" style="text-transform:uppercase;" />
        <button class="mic-btn" onclick="joinClass()" style="margin-top:12px;">Join Class →</button>
        <p id="join-error" style="color:#ff6b6b; font-size:13px; font-weight:700; min-height:20px; margin-top:8px;"></p>
      </div>
    </div>

    <div class="container" id="dashboard-screen" style="display:none">

      <div class="card welcome-card">
        <h2>Welcome back! 👋</h2>
        <p>You are in class: <span id="class-code-display"></span></p>
      </div>

      <div class="card">
        <h2>📢 Announcements</h2>
        <div id="announcements-display">
          <p class="empty-msg">No announcements yet.</p>
        </div>
      </div>

      <div class="card">
        <h2>🎤 Answer the Exercise</h2>
        <p class="subtitle">Click the button below to go to the simulation and say your answer out loud</p>
        <div id="mic-container">
          <button class="mic-btn" onclick="window.location.href='simulation.html'">
            ▶ Run Simulation
          </button>
        </div>
      </div>

    </div>

    <script src="student.js"></script>
  </body>
</html>
