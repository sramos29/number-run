<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Run - Student</title>
    <script src="../firebase/firebase.js"></script>
    <link rel="stylesheet" href="student.css" />
  </head>
  <body>
    <div class="header">
      <h1>🔢 Number Run</h1>
      <button class="logout-btn" onclick="window.location.href='../index.html'">
        Exit
      </button>
    </div>

    <div class="container">

      <div class="card welcome-card">
        <h2>Welcome back! 👋</h2>
        <p id="class-info">You are in class: <span id="class-code-display">Loading...</span></p>
      </div>

      <div class="card">
        <h2>📢 Announcements</h2>
        <div id="announcements-display">
          <p class="empty-msg">No announcements yet.</p>
        </div>
      </div>

      <div class="card">
        <h2>🧮 Today's Exercise</h2>
        <div id="exercise-display">
          <p class="empty-msg">No exercise assigned yet.</p>
        </div>
      </div>

      <div class="card">
        <h2>🎤 Answer the Exercise</h2>
        <p class="subtitle">Click the button below to go to the simulation and say your answer out loud</p>
        <div id="mic-container">
          <button class="mic-btn" onclick="window.location.href='simulation.html'">
            ▶ Run Simulation
          </button>
        </div>
      </div>

    </div>

    <script src="student.js"></script>
  </body>
</html>

<div id="display">
  <!-- JS will fill this -->
</div>

<div id="simulation" style="display:none">
  <p id="exercise-text"></p>
  <button id="mic-btn" onclick="startListening()">🎙️ Tap to Speak</button>
  <p id="transcript-box"></p>
  <p id="result-box"></p>
</div>
